[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "flood-risk-gis-toolkit"
version = "1.0.0"
description = "Reproducible educational grid-based flood risk screening"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "JauWei"}]

[tool.setuptools.packages.find]
where = ["src"]
